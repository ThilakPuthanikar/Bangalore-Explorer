<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore Bengaluru (Bangalore), the Garden City & Silicon Valley of India. Discover temples, IT hubs, shopping, sports, entertainment, hotels, hospitals, and history with full English and Kannada support.">
    <title>Bangalore Explorer</title>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body class="theme-on">
    <header class="header">
      <div class="header-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation menu" aria-expanded="false">
          ☰
        </button>
        <a href="#home" class="brand">
          <img src="assets/images/logo/logo.png" alt="Bangalore Explorer Logo" class="logo">
          <div class="title">
            <span class="appname">Bangalore Explorer</span>
            <span class="subtitle">Explore the City of Bangalore</span>
          </div>
        </a>
        <nav class="menu" id="navMenu" aria-label="Main navigation"></nav>
      </div>

      <div class="controls">
        <div class="lang-dropdown" id="langDropdown">
          <button class="lang-btn" id="langBtn" aria-haspopup="true">
            <span id="langLabel">English</span> ▾
          </button>
          <div class="lang-list" id="langList" role="menu">
            <button data-lang="en">English</button>
            <button data-lang="ka">ಕನ್ನಡ</button>
          </div>
        </div>

        <div class="theme-wrap" title="Toggle theme">
          <span class="theme-emoji" id="themeEmoji" aria-hidden="true">🌙</span>
          <div class="switch" id="themeSwitch" role="switch" tabindex="0" aria-label="Toggle light and dark theme">
            <div class="knob"></div>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="sections" id="sections"></div>
    </main>

    <!-- Landmark Detail Modal Dialog -->
    <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal">
        <button class="close" id="modalClose" aria-label="Close details">✕</button>
        <div class="topimg">
          <img id="modalImg" src="" alt="">
        </div>
        <div class="content">
          <h3 id="modalTitle"></h3>
          <p id="modalText"></p>
        </div>
      </div>
    </div>

    <!-- Scripts (Ordered for dependency-free static execution) -->
    <script src="assets/js/data.js"></script>
    <script src="assets/js/modal.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
