<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover, explore, and experience Bengaluru (Bangalore) with curated destinations, verified GPS coordinates, interactive OpenStreetMap, curated itineraries, cultural stories, and authentic bilingual English and Kannada coverage.">
    <title>Bangalore Explorer | ಬೆಂಗಳೂರು ಎಕ್ಸ್‌ಪ್ಲೋರರ್</title>

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <!-- Leaflet.js Mapping Library (Free, zero-key, zero-cost) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Application Stylesheets -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/components.css">

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/png" href="assets/images/logo/logo.png">
  </head>
  <body>
    <!-- Top Global Header -->
    <header class="header">
      <div class="header-left">
        <button class="mobile-menu-btn" id="mobileNavToggle" aria-label="Toggle navigation menu" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>

        <a href="#/home" class="brand">
          <img src="assets/images/logo/logo.png" alt="Bangalore Explorer Emblem" class="logo">
          <div class="title">
            <span class="appname">Bangalore Explorer</span>
            <span class="subtitle brand-sub">Bengaluru City Guide</span>
          </div>
        </a>

        <!-- Primary Navigation Menu -->
        <nav class="menu" id="primaryNavMenu" aria-label="Main navigation">
          <a href="#/home" class="nav-link" id="nav-link-home">Home</a>
          <a href="#/explore" class="nav-link" id="nav-link-explore">Explore</a>
          <a href="#/categories" class="nav-link" id="nav-link-categories">Categories</a>
          <a href="#/map" class="nav-link" id="nav-link-map">Map</a>
          <a href="#/itineraries" class="nav-link" id="nav-link-itineraries">Itineraries</a>
          <a href="#/stories" class="nav-link" id="nav-link-stories">Stories</a>
          <a href="#/about" class="nav-link" id="nav-link-about">About</a>
        </nav>
      </div>

      <!-- Action Controls -->
      <div class="controls">
        <!-- Language Switcher -->
        <div class="lang-select-wrapper">
          <select id="langSelect" class="lang-btn" aria-label="Select Language">
            <option value="en">English</option>
            <option value="ka">ಕನ್ನಡ</option>
          </select>
        </div>

        <!-- Saved Favorites Shortcut -->
        <a href="#/favorites" class="btn btn-sm btn-outline-secondary d-none d-sm-inline-flex align-items-center gap-1" title="Saved Favorites">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          <span class="badge fav-count-badge bg-danger text-white ms-1">0</span>
        </a>

        <!-- Personal Trip Planner Trigger -->
        <button class="btn btn-sm btn-primary planner-drawer-trigger d-inline-flex align-items-center gap-1" title="Personal Trip Planner">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-route"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg>
          <span class="badge planner-count-badge bg-white text-primary ms-1">0</span>
        </button>

        <!-- Theme Toggle -->
        <button id="themeToggle" class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1" aria-label="Toggle Theme">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <span>Dark</span>
        </button>
      </div>
    </header>

    <!-- Dynamic Main Content Area -->
    <main id="main-app-content" class="app-main"></main>

    <!-- Landmark Detail Modal Dialog -->
    <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal-card" id="modalCard">
        <!-- Injected dynamically by ModalController -->
      </div>
    </div>

    <!-- Personal Trip Planner Drawer -->
    <div class="planner-backdrop" id="plannerBackdrop"></div>
    <aside class="planner-drawer" id="plannerDrawer" aria-label="Trip Planner Drawer">
      <button class="drawer-close-btn planner-drawer-trigger" aria-label="Close trip planner">&times;</button>
      <div id="planner-drawer-content">
        <!-- Injected dynamically by PlannerController -->
      </div>
    </aside>

    <!-- Bottom Mobile Navigation Bar -->
    <nav class="bottom-mobile-nav" aria-label="Mobile Bottom Navigation">
      <a href="#/home" class="bottom-nav-item active">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-home"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <small>Home</small>
      </a>
      <a href="#/explore" class="bottom-nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <small>Explore</small>
      </a>
      <a href="#/map" class="bottom-nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" x2="9" y1="3" y2="18"/><line x1="15" x2="15" y1="6" y2="21"/></svg>
        <small>Map</small>
      </a>
      <a href="#/itineraries" class="bottom-nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-route"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg>
        <small>Trails</small>
      </a>
      <button class="bottom-nav-item planner-drawer-trigger bg-transparent border-0" aria-label="Open planner">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-check"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="m9 16 2 2 4-4"/></svg>
        <small>Trip (<span class="planner-count-badge">0</span>)</small>
      </button>
    </nav>

    <!-- Global Ultra-Minimal Compact Footer (No Quick Links) -->
    <footer class="app-footer-minimal border-top bg-surface">
      <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2 py-3 fs-xs text-muted">
        <div class="d-flex align-items-center gap-2">
          <img src="assets/images/logo/logo.png" alt="Bangalore Explorer" width="20" height="20" class="opacity-80">
          <span class="font-weight-medium">Bangalore Explorer • ಬೆಂಗಳೂರು ಎಕ್ಸ್‌ಪ್ಲೋರರ್</span>
        </div>
        <div>
          <span>© 2026 Namma Bengaluru • 100% Static &amp; Open • Built and Managed by Thilak Puthanikar</span>
        </div>
      </div>
    </footer>

    <!-- Scripts (Ordered for static client-side execution) -->
    <!-- 1. Leaflet Mapping Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- 2. Lucide SVG Icon System -->
    <script src="assets/js/icons.js"></script>
    <!-- 3. Master Data Store (68+ Places, 9 Categories, 6 Itineraries, 4 Stories) -->
    <script src="assets/js/data.js"></script>
    <!-- 4. Geolocation & Direction Service -->
    <script src="assets/js/geo.js"></script>
    <!-- 5. LocalStorage & State Management -->
    <script src="assets/js/storage.js"></script>
    <!-- 6. Bilingual Search Engine -->
    <script src="assets/js/search.js"></script>
    <!-- 7. Interactive Leaflet Map Controller -->
    <script src="assets/js/map.js"></script>
    <!-- 8. Trip Planner & Itineraries Controller -->
    <script src="assets/js/planner.js"></script>
    <!-- 9. Hash Router -->
    <script src="assets/js/router.js"></script>
    <!-- 10. Accessible Modal Controller -->
    <script src="assets/js/modal.js"></script>
    <!-- 11. Master App Coordinator -->
    <script src="assets/js/app.js"></script>
  </body>
</html>
